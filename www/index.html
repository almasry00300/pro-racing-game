<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Racing 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #03030c; user-select: none; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
        #dashboard { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        .hud-card { background: rgba(0, 0, 0, 0.8); padding: 8px 15px; border-left: 4px solid #00ffff; border-radius: 4px; }
        .speed-text { font-size: 24px; font-weight: bold; color: #00ffcc; font-family: monospace; }
        .score-text { font-size: 20px; font-weight: bold; color: #ffcc00; font-family: monospace; }
        #menu-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 25, 0.95); border: 2px solid #00ffcc; border-radius: 12px; padding: 20px; color: white; z-index: 20; display: none; text-align: center; width: 300px; }
        .menu-btn { background: #00ffcc; color: #000; border: none; padding: 10px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; margin-top: 10px; width: 100%; }
        .controls-container { position: absolute; bottom: 30px; width: 100vw; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 10; pointer-events: none; }
        .btn-group { display: flex; gap: 20px; pointer-events: auto; }
        .control-btn { width: 75px; height: 75px; background: rgba(15, 15, 25, 0.6); border: 2px solid #00ffcc; border-radius: 50%; color: #00ffcc; font-size: 24px; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; touch-action: none; }
        .control-btn:active { background: rgba(0, 255, 255, 0.4); }
        #btn-up { border-color: #00ff66; color: #00ff66; }
        #btn-down { border-color: #ff3333; color: #ff3333; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <div id="dashboard">
        <div class="hud-card"><div>المضمار: <span style="color:#00ffff;">طوكيو النيون</span></div></div>
        <div class="hud-card"><div>السرعة الحالية</div><div class="speed-text"><span id="speed-val">0</span> KM/H</div></div>
        <div class="hud-card" style="border-left-color: #ffcc00;"><div>العملات</div><div class="score-text">💰 <span id="coins-val">0</span></div></div>
    </div>
    <div id="menu-overlay">
        <h3>🏪 المتجر العالمي</h3>
        <button class="menu-btn" id="buy-car-btn">فتح السيارة السريعة (5 عملات)</button>
        <button class="menu-btn" id="resume-btn" style="background:#ff0055; color:white; margin-top:20px;">العودة للسباق 🏁</button>
    </div>
    <div id="canvas-container"></div>
    <div class="controls-container">
        <div class="btn-group"><div class="control-btn" id="btn-left">◀</div><div class="control-btn" id="btn-right">▶</div></div>
        <div class="btn-group"><div class="control-btn" id="btn-down">⬇</div><div class="control-btn" id="btn-up">▲</div></div>
    </div>
    <script>
        let coinsCollected = parseInt(localStorage.getItem('racing_coins')) || 0;
        let hasSuperCar = localStorage.getItem('has_super_car') === 'true';
        document.getElementById('coins-val').innerText = coinsCollected;

        const scene = new THREE.Scene(); scene.background = new THREE.Color(0x020208); scene.fog = new THREE.FogExp2(0x020208, 0.015);
        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight); document.getElementById('canvas-container').appendChild(renderer.domElement);

        const track = new THREE.Group();
        const road = new THREE.Mesh(new THREE.PlaneGeometry(35, 4000), new THREE.MeshBasicMaterial({ color: 0x111116 })); road.rotation.x = -Math.PI / 2; track.add(road);
        const lWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2, 4000), new THREE.MeshBasicMaterial({ color: 0xff0055 })); lWall.position.set(-17.5, 1, 0); track.add(lWall);
        const rWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2, 4000), new THREE.MeshBasicMaterial({ color: 0x00ffcc })); rWall.position.set(17.5, 1, 0); track.add(rWall);
        scene.add(track);

        const coinsArray = []; const coinGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16); const coinMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        for (let i = -200; i > -3500; i -= 150) {
            const coin = new THREE.Mesh(coinGeo, coinMat); coin.rotation.x = Math.PI / 2; coin.position.set((Math.random() - 0.5) * 24, 0.8, i); scene.add(coin); coinsArray.push(coin);
        }

        const car = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.5, 4.5), new THREE.MeshBasicMaterial({ color: hasSuperCar ? 0xffff00 : 0x00ffcc })); body.position.y = 0.4; car.add(body);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2), new THREE.MeshBasicMaterial({ color: 0x05050a })); cabin.position.set(0, 0.8, -0.3); car.add(cabin); scene.add(car);
        camera.position.set(0, 4.5, 9);

        let speed = 0; let maxSpeed = hasSuperCar ? 6.0 : 3.2; let accel = 0.07; let friction = 0.02; let turnSpeed = 0.05;
        const keys = { up: false, down: false, left: false, right: false };
        function bindTouch(id, keyProp) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyProp] = true; }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyProp] = false; }, {passive: false});
        }
        bindTouch('btn-up', 'up'); bindTouch('btn-down', 'down'); bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');

        document.getElementById('dashboard').addEventListener('click', () => { document.getElementById('menu-overlay').style.display = 'block'; speed = 0; });
        document.getElementById('resume-btn').addEventListener('click', () => { document.getElementById('menu-overlay').style.display = 'none'; });
        document.getElementById('buy-car-btn').addEventListener('click', () => {
            if (!hasSuperCar && coinsCollected >= 5) { localStorage.setItem('has_super_car', 'true'); localStorage.setItem('racing_coins', coinsCollected - 5); location.reload(); }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (keys.up) { speed = Math.min(speed + accel, maxSpeed); } else if (keys.down) { speed = Math.max(speed - accel, -maxSpeed/2); } else { speed = speed > 0 ? Math.max(speed - friction, 0) : Math.min(speed + friction, 0); }
            if (Math.abs(speed) > 0.05) { const r = turnSpeed * (speed / maxSpeed); if (keys.left) car.rotation.y += r; if (keys.right) car.rotation.y -= r; }
            car.translateZ(-speed);
            if (car.position.x < -16.0) { car.position.x = -16.0; speed *= 0.3; } if (car.position.x > 16.0) { car.position.x = 16.0; speed *= 0.3; }

            coinsArray.forEach((coin) => {
                if (coin.visible) {
                    coin.rotation.z += 0.03;
                    if (car.position.distanceTo(coin.position) < 2.6) { coin.visible = false; coinsCollected++; localStorage.setItem('racing_coins', coinsCollected); document.getElementById('coins-val').innerText = coinsCollected; }
                }
            });

            const cameraOffset = new THREE.Vector3(0, 4.5, 9).applyMatrix4(car.matrixWorld); camera.position.copy(cameraOffset); camera.lookAt(car.position.x, car.position.y + 0.5, car.position.z);
            document.getElementById('speed-val').innerText = Math.round(Math.abs(speed) * 110); renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
